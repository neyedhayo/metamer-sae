[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metamer-sae"
version = "0.2.0"
description = "Metamer-SAE: PCA and TopK-SAE analysis of model metamers across ResNet-50, AlexNet and IPCL generators (common-observer and generator-native tracks)."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4",
  "torch>=2.2", "torchvision>=0.17", "pillow>=10", "pyyaml>=6",
  "pydantic>=2.5", "matplotlib>=3.8", "tqdm>=4.66", "pyarrow>=14",
]

[project.optional-dependencies]
sae = ["overcomplete==0.3.0"]
baselines = ["scikit-image>=0.22", "lpips>=0.1.4"]
feather = ["resampy", "tensorboardX", "cox"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
metamer-sae = "metamer_sae.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["parity: needs pilot reference artifacts on disk", "gpu: needs CUDA", "network: needs Feather network access"]
addopts = "-q"

[tool.ruff]
line-length = 100
